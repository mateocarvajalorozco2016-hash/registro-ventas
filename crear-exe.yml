name: Crear EXE de Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Crear EXE portable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name RegistroVentas
          --add-data "datos/dinero_predeterminado;datos/dinero_predeterminado"
          app.py

      - name: Subir EXE como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegistroVentas-Windows
          path: dist/RegistroVentas.exe
          if-no-files-found: error
